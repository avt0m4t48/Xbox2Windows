name: Runtime mesh lowering D3D12 verification
on:
  push:
    branches: [verify/runtime-mesh-lowering]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run the native D3D12 mesh fixture
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsBuildNumber | Format-List
          .\tools\dev.ps1
          $python = (Get-Command python).Source
          cmake --preset release "-DINTAKE_PYTHON=$python"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target offscreen_check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset release --no-tests=error -R '^mesh_dynamic_aot_(cpu|draw_warp)$' -V
          exit $LASTEXITCODE
