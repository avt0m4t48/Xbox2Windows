name: Indirect indexed draw verification
on:
  push:
    branches: [verify/startup-indirect-indexed]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, upstream-runtime]
    name: WARP / ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Build and run
        shell: pwsh
        env:
          FIXTURE_MODE: ${{ matrix.mode }}
        run: |
          if ($env:FIXTURE_MODE -eq 'upstream-runtime') {
            git restore --source=df40e4bc -- src/startup_stubs/d3d12_xs_device.cpp
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          .\tools\dev.ps1
          cmake --preset release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target startup_indirect_draw_indexed startup_indirect_dispatch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:FIXTURE_MODE -eq 'candidate') {
            ctest --preset release --no-tests=error -R '^startup_indirect_(draw_indexed|dispatch)_warp$' -V
            exit $LASTEXITCODE
          }
          $output = & .\out\build\release\startup_indirect_draw_indexed.exe warp 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 1 -or ($output -join "`n") -notmatch 'left writer: pixel \(0,0\): got 0xff000000, expected 0xff0000ff') {
            throw 'The unmodified runtime did not cause the expected indexed-draw pixel mismatch'
          }
          exit 0
