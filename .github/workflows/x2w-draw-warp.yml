name: Indirect Draw verification
on:
  push:
    branches: [verify/startup-indirect-draw]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build and run all three indirect fixtures
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsBuildNumber | Format-List
          .\tools\dev.ps1
          cmake --preset release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target startup_indirect_draw_indexed startup_indirect_dispatch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset release --no-tests=error -R '^startup_indirect_(dispatch|draw(_indexed)?)_warp$' -V
          exit $LASTEXITCODE
