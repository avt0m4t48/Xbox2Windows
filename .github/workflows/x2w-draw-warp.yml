name: Indirect Draw verification
on:
  push:
    branches: [verify/startup-indirect-draw]
permissions:
  contents: read
jobs:
  warp:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build and check the upstream baseline
        shell: pwsh
        run: |
          Get-ComputerInfo -Property OsName,OsBuildNumber | Format-List
          .\tools\dev.ps1
          cmake --preset release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release --target startup_indirect_draw_indexed startup_indirect_dispatch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset release --no-tests=error -R '^startup_indirect_(dispatch|draw_indexed)_warp$' -V
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & .\out\build\release\startup_indirect_draw_indexed.exe warp draw 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 1 -or ($output -join "`n") -notmatch 'one triangle: pixel \(0,0\): got 0xff000000, expected 0xff0000ff') {
            throw 'The upstream runtime did not produce the expected Draw pixel mismatch'
          }
          exit 0
